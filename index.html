<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Outline</title>
<meta name="description" content="An outline that follows your voice and highlights the point you're on.">
<meta name="theme-color" content="#f6f5fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101014" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Live Outline">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <h1>Live Outline</h1>
  <div class="topbar-right">
  <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙︎</button>
  <div class="segmented" role="tablist">
    <button id="tabEdit" role="tab" aria-selected="true">Edit</button>
    <button id="tabPresent" role="tab" aria-selected="false">Present</button>
  </div>
  </div>
</header>

<div id="notice" class="notice" hidden></div>

<main>
  <section id="edit">
    <label for="outlineInput">One point per line. Indent to nest. Add hidden hints with <code>[cues: word, word]</code>.</label>
    <textarea id="outlineInput" spellcheck="false" autocapitalize="sentences"></textarea>
    <h2>Preview</h2>
    <ul id="preview"></ul>
    <button id="presentBtn" class="primary big">▶ Present</button>
  </section>

  <section id="present" hidden>
    <div class="progress"><div id="progressFill"></div></div>
    <p class="progress-text"><span id="progressText"></span><span id="brain" class="brain" hidden></span></p>
    <div class="stage">
      <div id="highlight" class="highlight" aria-hidden="true"></div>
      <ol id="outline"></ol>
    </div>
  </section>
</main>

<footer id="dock" class="dock" hidden>
  <div id="ticker" class="ticker" aria-live="polite"></div>
  <div class="dock-row">
    <button id="prevBtn" class="round" aria-label="Previous point">‹</button>
    <button id="micBtn" class="mic" aria-label="Start listening">
      <span class="mic-icon" aria-hidden="true"></span>
      <span id="micLabel">Listen</span>
    </button>
    <button id="nextBtn" class="round" aria-label="Next point">›</button>
  </div>
</footer>

<dialog id="settings">
  <form method="dialog">
    <h3>Smart following</h3>
    <p class="muted">Claude helps follow the speaker even when they don't use the outline's words, and remembers the words they use so the app gets quicker over time.</p>
    <label class="row"><input type="checkbox" id="aiToggle"> Use Claude</label>
    <label for="codeInput">Access code</label>
    <input id="codeInput" type="password" autocomplete="off" placeholder="Enter your access code">
    <p id="libStats" class="muted"></p>
    <div class="dialog-actions">
      <button type="button" id="resetLib" class="danger">Forget learned words</button>
      <button value="close" class="primary pill">Done</button>
    </div>
  </form>
</dialog>

<script src="matcher.js"></script>
<script src="app.js"></script>
</body>
</html>
